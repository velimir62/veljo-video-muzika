<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Offline MP3 Player</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 20px; text-align: center; }
        #player { background: #16213e; padding: 20px; border-radius: 12px; max-width: 500px; margin: auto; }
        audio { width: 100%; margin: 10px 0; }
        #playlist { list-style: none; padding: 0; max-height: 350px; overflow-y: auto; text-align: left; }
        #playlist li { padding: 8px 12px; margin: 4px 0; background: #0f3460; border-radius: 8px; cursor: pointer; }
        #playlist li:hover { background: #1a4a7a; }
        .playing { background: #4CAF50 !important; }
        .back { display: block; margin-top: 20px; color: #4CAF50; }
    </style>
</head>
<body>
    <h1>🎵 Offline MP3 Player</h1>
    <div id="player">
        <audio id="audioPlayer" controls></audio>
        <div id="nowPlaying" style="margin:8px 0;">Select a song</div>
        <ul id="playlist"></ul>
    </div>
    <a href="/" class="back">⬅ Back</a>

    <script>
        (function() {
            const audio = document.getElementById('audioPlayer');
            const playlist = document.getElementById('playlist');
            const nowPlaying = document.getElementById('nowPlaying');

            // Load songs.txt
            fetch('/songs.txt')
                .then(res => {
                    if (!res.ok) throw new Error('songs.txt not found');
                    return res.text();
                })
                .then(text => {
                    const files = text.split('\n')
                        .map(s => s.trim())
                        .filter(s => s.length > 0 && s.endsWith('.mp3'));

                    if (files.length === 0) {
                        playlist.innerHTML = '<li style="color:#ff6b6b;">No MP3 files found. Run: ls *.mp3 > songs.txt</li>';
                        return;
                    }

                    files.forEach(file => {
                        const li = document.createElement('li');
                        li.textContent = file.replace(/\.mp3$/i, '').replace(/_/g, ' ');
                        li.dataset.file = file;
                        li.addEventListener('click', function(e) {
                            const encoded = encodeURIComponent(file);
                            audio.src = encoded;
                            audio.load();
                            audio.play().catch(err => console.log('Autoplay blocked – click play.'));
                            nowPlaying.textContent = '▶ ' + file;
                            document.querySelectorAll('#playlist li').forEach(el => el.classList.remove('playing'));
                            this.classList.add('playing');
                        });
                        playlist.appendChild(li);
                    });

                    // Auto‑play first song
                    if (files.length > 0) {
                        const first = files[0];
                        const encoded = encodeURIComponent(first);
                        audio.src = encoded;
                        audio.load();
                        audio.play().catch(err => console.log('Autoplay blocked – click play manually.'));
                        nowPlaying.textContent = '▶ ' + first;
                        document.querySelector('#playlist li')?.classList.add('playing');
                    }
                })
                .catch(err => {
                    console.error('Error loading songs.txt:', err);
                    playlist.innerHTML = '<li style="color:#ff6b6b;">Error: songs.txt missing or unreadable</li>';
                });
        })();
    </script>
</body>
</html>
