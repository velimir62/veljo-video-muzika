<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VELJO VIDEO MUZIKA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            background: #111;
            padding: 22px 15px;
            text-align: center;
            border-bottom: 2px solid #ffd700;
        }

        header h1 {
            margin: 0;
            color: #ffd700;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            color: #aaa;
            font-size: 14px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 25px auto;
        }

        /* VIDEO */

        .video-box {
            background: #111;
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.08);
        }

        video {
            display: block;
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 10px;
        }

        /* INFO */

        .now-playing {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            padding: 15px;
            background: #181818;
            border-radius: 10px;
        }

        .current-song {
            color: #ffd700;
            font-size: 20px;
            font-weight: bold;
            word-break: break-word;
        }

        .song-number {
            color: #aaa;
            white-space: nowrap;
        }

        /* BUTTONS */

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0;
        }

        button {
            border: none;
            background: #222;
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        button:hover {
            background: #333;
            transform: translateY(-1px);
        }

        button.active {
            background: #ffd700;
            color: #000;
        }

        /* SEARCH */

        .search-box {
            margin: 20px 0;
        }

        #search {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 9px;
            background: #151515;
            color: white;
            font-size: 16px;
            outline: none;
        }

        #search:focus {
            border-color: #ffd700;
        }

        /* PLAYLIST */

        .playlist-title {
            color: #ffd700;
            font-size: 22px;
            margin: 20px 0 12px;
        }

        #playlist {
            display: grid;
            gap: 8px;
        }

        .song {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 14px 16px;
            background: #151515;
            border: 1px solid #222;
            border-radius: 9px;
            cursor: pointer;
            transition: 0.2s;
        }

        .song:hover {
            background: #222;
            border-color: #444;
        }

        .song.active {
            background: #332d00;
            border-color: #ffd700;
        }

        .song-name {
            font-size: 16px;
            word-break: break-word;
        }

        .song-number-small {
            color: #888;
            min-width: 35px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        .error {
            background: #300;
            color: #ff9999;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            line-height: 1.5;
        }

        footer {
            margin-top: 35px;
            padding: 25px;
            text-align: center;
            color: #666;
            border-top: 1px solid #222;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 23px;
            }

            .now-playing {
                flex-direction: column;
                align-items: flex-start;
            }

            .current-song {
                font-size: 17px;
            }

            .song {
                align-items: flex-start;
            }

            button {
                padding: 10px 13px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 VELJO VIDEO MUZIKA</h1>
    <p>Video muzika — MP4</p>
</header>


<div class="container">

    <!-- VIDEO PLAYER -->

    <div class="video-box">

        <video
            id="videoPlayer"
            controls
            playsinline
            preload="metadata">
        </video>

        <div class="now-playing">

            <div>
                <div style="font-size:12px;color:#777;margin-bottom:5px;">
                    TRENUTNO SVIRA
                </div>

                <div
                    id="currentSong"
                    class="current-song">
                    Učitavanje...
                </div>
            </div>

            <div
                id="songNumber"
                class="song-number">
                0 / 0
            </div>

        </div>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            id="previousButton"
            title="Prethodni video">
            ⏮ Prethodni
        </button>

        <button
            id="playButton"
            title="Play / Pause">
            ▶ Play
        </button>

        <button
            id="nextButton"
            title="Sljedeći video">
            Sljedeći ⏭
        </button>

        <button
            id="shuffleButton"
            title="Nasumično">
            🔀 Shuffle
        </button>

        <button
            id="repeatButton"
            title="Ponavljanje">
            🔁 Repeat
        </button>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="search"
            type="search"
            placeholder="🔎 Pretraži video..."
            autocomplete="off">

    </div>


    <!-- PLAYLIST -->

    <div class="playlist-title">
        🎵 PLAYLISTA
    </div>

    <div id="playlist">

        <div class="loading">
            Učitavam MP4 fajlove...
        </div>

    </div>


    <div id="errorBox"></div>

</div>


<footer>
    VELJO VIDEO MUZIKA © 2026
</footer>


<script>

    /*
    =====================================================
       PODEŠAVANJE REPOZITORIJA
    =====================================================
    */

    const GITHUB_USER = "velimir62";
    const GITHUB_REPO = "veljo-video-muzika";
    const GITHUB_BRANCH = "main";
    const VIDEO_FOLDER = "processed";


    /*
    =====================================================
       URL ZA GITHUB API
    =====================================================
    */

    const API_URL =
        `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${VIDEO_FOLDER}?ref=${GITHUB_BRANCH}`;


    /*
    =====================================================
       ELEMENTI
    =====================================================
    */

    const videoPlayer =
        document.getElementById("videoPlayer");

    const playlist =
        document.getElementById("playlist");

    const currentSong =
        document.getElementById("currentSong");

    const songNumber =
        document.getElementById("songNumber");

    const playButton =
        document.getElementById("playButton");

    const previousButton =
        document.getElementById("previousButton");

    const nextButton =
        document.getElementById("nextButton");

    const shuffleButton =
        document.getElementById("shuffleButton");

    const repeatButton =
        document.getElementById("repeatButton");

    const search =
        document.getElementById("search");

    const errorBox =
        document.getElementById("errorBox");


    /*
    =====================================================
       VARIJABLE
    =====================================================
    */

    let mp4Files = [];

    let currentIndex = 0;

    let shuffle = false;

    let repeat = false;


    /*
    =====================================================
       PRIKAŽI GREŠKU
    =====================================================
    */

    function showError(message) {

        errorBox.innerHTML = `
            <div class="error">
                <strong>Greška:</strong><br>
                ${message}
            </div>
        `;
    }


    /*
    =====================================================
       UČITAJ MP4 FAJLOVE SA GITHUBA
    =====================================================
    */

    async function loadVideos() {

        try {

            const response =
                await fetch(API_URL);

            if (!response.ok) {

                throw new Error(
                    `GitHub API greška: ${response.status}`
                );

            }

            const files =
                await response.json();


            /*
               Uzmi samo MP4 fajlove
            */

            mp4Files = files
                .filter(file =>
                    file.type === "file" &&
                    /\.mp4$/i.test(file.name)
                )
                .sort((a, b) =>
                    a.name.localeCompare(
                        b.name,
                        "sr",
                        {
                            sensitivity: "base"
                        }
                    )
                );


            if (mp4Files.length === 0) {

                throw new Error(
                    "U folderu processed nisu pronađeni MP4 fajlovi."
                );

            }


            /*
               Prikaži playlistu
            */

            renderPlaylist(mp4Files);


            /*
               Prvi video
            */

            updateCurrentSong();

        }

        catch (error) {

            console.error(error);

            playlist.innerHTML = "";

            showError(
                "Nisam mogao učitati video fajlove. " +
                "Provjeri da li je GitHub repository javan " +
                "i da li folder processed postoji."
            );

        }

    }


    /*
    =====================================================
       NAPRAVI PLAYLISTU
    =====================================================
    */

    function renderPlaylist(files) {

        playlist.innerHTML = "";


        files.forEach((file, index) => {

            const song =
                document.createElement("div");

            song.className = "song";

            song.dataset.index = index;


            song.innerHTML = `

                <div style="display:flex;gap:10px;align-items:center;min-width:0;">

                    <div class="song-number-small">
                        ${index + 1}
                    </div>

                    <div class="song-name">
                        🎬 ${escapeHtml(
                            removeExtension(file.name)
                        )}
                    </div>

                </div>

            `;


            song.addEventListener(
                "click",
                () => playSong(index)
            );


            playlist.appendChild(song);

        });


        updatePlaylist();

    }


    /*
    =====================================================
       UKLONI .MP4
    =====================================================
    */

    function removeExtension(filename) {

        return filename.replace(
            /\.mp4$/i,
            ""
        );

    }


    /*
    =====================================================
       ZAŠTITA HTML TEKSTA
    =====================================================
    */

    function escapeHtml(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /*
    =====================================================
       URL VIDEA
    =====================================================
    */

    function getVideoURL(filename) {

        return (
            "https://raw.githubusercontent.com/" +
            GITHUB_USER +
            "/" +
            GITHUB_REPO +
            "/" +
            GITHUB_BRANCH +
            "/" +
            VIDEO_FOLDER +
            "/" +
            encodeURIComponent(filename)
        );

    }


    /*
    =====================================================
       PUSTI VIDEO
    =====================================================
    */

    function playSong(index) {

        if (
            index < 0 ||
            index >= mp4Files.length
        ) {
            return;
        }


        currentIndex = index;


        const file =
            mp4Files[currentIndex];


        currentSong.textContent =
            removeExtension(file.name);


        songNumber.textContent =
            `${currentIndex + 1} / ${mp4Files.length}`;


        /*
           encodeURIComponent omogućava:
           - razmake
           - ćirilicu
           - Š
           - Č
           - Ć
           - Ž
           - druge znakove
        */

        videoPlayer.src =
            getVideoURL(file.name);


        videoPlayer.load();


        updatePlaylist();


        /*
           Pokušaj automatskog pokretanja.
           Browser može blokirati autoplay,
           što je normalno.
        */

        videoPlayer.play().catch(() => {

            console.log(
                "Autoplay je blokiran. Pritisni Play."
            );

        });

    }


    /*
    =====================================================
       PLAY / PAUSE
    =====================================================
    */

    function togglePlay() {

        if (!videoPlayer.src) {

            playSong(currentIndex);

            return;

        }


        if (videoPlayer.paused) {

            videoPlayer.play();

        } else {

            videoPlayer.pause();

        }

    }


    /*
    =====================================================
       PRETHODNI
    =====================================================
    */

    function previousSong() {

        if (mp4Files.length === 0) {
            return;
        }


        /*
           Ako je video već počeo,
           vrati ga na početak.
        */

        if (videoPlayer.currentTime > 3) {

            videoPlayer.currentTime = 0;

            return;

        }


        currentIndex--;


        if (currentIndex < 0) {

            currentIndex =
                mp4Files.length - 1;

        }


        playSong(currentIndex);

    }


    /*
    =====================================================
       SLJEDEĆI
    =====================================================
    */

    function nextSong() {

        if (mp4Files.length === 0) {
            return;
        }


        if (shuffle && mp4Files.length > 1) {

            let newIndex;


            do {

                newIndex =
                    Math.floor(
                        Math.random() *
                        mp4Files.length
                    );

            } while (
                newIndex === currentIndex
            );


            currentIndex =
                newIndex;

        }

        else {

            currentIndex++;


            if (
                currentIndex >=
                mp4Files.length
            ) {

                currentIndex = 0;

            }

        }


        playSong(currentIndex);

    }


    /*
    =====================================================
       VIDEO ZAVRŠEN
    =====================================================
    */

    videoPlayer.addEventListener(
        "ended",
        () => {

            if (repeat) {

                videoPlayer.currentTime = 0;

                videoPlayer.play();

            }

            else {

                nextSong();

            }

        }
    );


    /*
    =====================================================
       PLAY / PAUSE IKONA
    =====================================================
    */

    videoPlayer.addEventListener(
        "play",
        () => {

            playButton.textContent =
                "⏸ Pause";

        }
    );


    videoPlayer.addEventListener(
        "pause",
        () => {

            playButton.textContent =
                "▶ Play";

        }
    );


    /*
    =====================================================
       SHUFFLE
    =====================================================
    */

    shuffleButton.addEventListener(
        "click",
        () => {

            shuffle =
                !shuffle;

            shuffleButton.classList.toggle(
                "active",
                shuffle
            );

        }
    );


    /*
    =====================================================
       REPEAT
    =====================================================
    */

    repeatButton.addEventListener(
        "click",
        () => {

            repeat =
                !repeat;

            repeatButton.classList.toggle(
                "active",
                repeat
            );

        }
    );


    /*
    =====================================================
       BUTTONI
    =====================================================
    */

    playButton.addEventListener(
        "click",
        togglePlay
    );


    previousButton.addEventListener(
        "click",
        previousSong
    );


    nextButton.addEventListener(
        "click",
        nextSong
    );


    /*
    =====================================================
       PRETRAGA
    =====================================================
    */

    search.addEventListener(
        "input",
        () => {

            const query =
                search.value
                    .trim()
                    .toLowerCase();


            const songs =
                document.querySelectorAll(".song");


            songs.forEach(song => {

                const name =
                    song
                        .querySelector(".song-name")
                        .textContent
                        .toLowerCase();


                if (
                    name.includes(query)
                ) {

                    song.style.display =
                        "flex";

                }

                else {

                    song.style.display =
                        "none";

                }

            });

        }
    );


    /*
    =====================================================
       AKTIVNA PJESMA
    =====================================================
    */

    function updatePlaylist() {

        const songs =
            document.querySelectorAll(".song");


        songs.forEach(
            (song, index) => {

                if (
                    index === currentIndex
                ) {

                    song.classList.add(
                        "active"
                    );

                    /*
                       Automatski pomjeri
                       playlistu do aktivnog videa
                    */

                    song.scrollIntoView({
                        behavior: "smooth",
                        block: "nearest"
                    });

                }

                else {

                    song.classList.remove(
                        "active"
                    );

                }

            }
        );

    }


    /*
    =====================================================
       INFORMACIJA O TRENUTNOM VIDEU
    =====================================================
    */

    function updateCurrentSong() {

        if (
            mp4Files.length === 0
        ) {
            return;
        }


        const file =
            mp4Files[currentIndex];


        currentSong.textContent =
            removeExtension(file.name);


        songNumber.textContent =
            `${currentIndex + 1} / ${mp4Files.length}`;

    }


    /*
    =====================================================
       TIPKE NA TASTATURI
    =====================================================
    */

    document.addEventListener(
        "keydown",
        (event) => {

            /*
               Ne reaguj dok korisnik piše
               u pretrazi
            */

            if (
                event.target.tagName ===
                "INPUT"
            ) {
                return;
            }


            if (event.code === "Space") {

                event.preventDefault();

                togglePlay();

            }


            if (
                event.code === "ArrowRight"
            ) {

                nextSong();

            }


            if (
                event.code === "ArrowLeft"
            ) {

                previousSong();

            }

        }
    );


    /*
    =====================================================
       GREŠKA VIDEA
    =====================================================
    */

    videoPlayer.addEventListener(
        "error",
        () => {

            showError(
                "Video se ne može učitati: " +
                currentSong.textContent
            );

        }
    );


    /*
    =====================================================
       START
    ===================================================== */

    loadVideos();

</script>

</body>
</html>
