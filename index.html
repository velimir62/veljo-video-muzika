<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELJO-VIDEO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #0b1020;
    color: #e8e8e8;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    max-width: 800px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #e94560;
    font-size: 36px;
    margin: 10px 0 5px;
    letter-spacing: 2px;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 20px;
}

.player-box {
    background: #16213e;
    padding: 20px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    margin-bottom: 20px;
}

.now-playing {
    text-align: center;
    color: #e94560;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 15px;
}

video {
    width: 100%;
    max-height: 65vh;
    background: #000;
    border-radius: 10px;
    display: block;
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #e94560;
    color: white;
    font-size: 16px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #ff5570;
}

button:active {
    transform: scale(.98);
}

.navigation {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.navigation a {
    flex: 1;
    text-decoration: none;
    text-align: center;
    padding: 13px;
    border-radius: 8px;
    background: #0f3460;
    color: white;
    font-weight: bold;
}

.navigation a:hover {
    background: #e94560;
}

ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

li {
    background: #16213e;
    margin: 8px 0;
    padding: 13px 16px;
    border-radius: 9px;
    transition: .2s;
}

li:hover {
    background: #0f3460;
    transform: scale(1.01);
}

li.active {
    background: #0f3460;
    border-left: 4px solid #e94560;
}

li a {
    color: #e8e8e8;
    text-decoration: none;
    display: block;
    font-size: 17px;
}

.status {
    text-align: center;
    color: #777;
    margin-top: 20px;
    font-size: 13px;
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 28px;
    }

    .controls {
        flex-direction: column;
    }

    .navigation {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🎬 VELJO-VIDEO</h1>
    <div class="subtitle">MP4 Media Center</div>

    <div class="navigation">
        <a href="https://velimir62.github.io/moja-muzika/">🎵 VELJO-RADIO</a>
        <a href="https://velimir62.github.io/veljo-video-muzika/">🎬 VELJO-VIDEO</a>
    </div>

    <div class="player-box">

        <div id="nowPlaying" class="now-playing">
            🎬 Učitavanje videa...
        </div>

        <video
            id="player"
            controls
            playsinline
            preload="metadata">
        </video>

        <div class="controls">
            <button id="play">▶ Pokreni</button>
            <button id="prev">⏮ Prethodni</button>
            <button id="next">Sljedeći ⏭</button>
        </div>

    </div>

    <ul id="playlist"></ul>

    <div id="status" class="status">
        Učitavanje...
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    const playlist =
        document.getElementById("playlist");

    const player =
        document.getElementById("player");

    const nowPlaying =
        document.getElementById("nowPlaying");

    const status =
        document.getElementById("status");

    const playButton =
        document.getElementById("play");

    const prevButton =
        document.getElementById("prev");

    const nextButton =
        document.getElementById("next");

    let videos = [];
    let current = -1;

    async function scanFolder(url) {

        const fullFolderUrl =
            new URL(
                url,
                window.location.href
            ).href;

        const response =
            await fetch(
                fullFolderUrl,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "Ne mogu otvoriti music/"
            );
        }

        const html =
            await response.text();

        const doc =
            new DOMParser()
                .parseFromString(
                    html,
                    "text/html"
                );

        const links =
            Array.from(
                doc.querySelectorAll("a")
            );

        const result = [];

        for (const link of links) {

            const href =
                link.getAttribute("href");

            if (
                !href ||
                href === "../" ||
                href === "./"
            ) {
                continue;
            }

            const full =
                new URL(
                    href,
                    fullFolderUrl
                );

            const pathParts =
                full.pathname
                    .split("/")
                    .filter(Boolean);

            const name =
                decodeURIComponent(
                    pathParts[
                        pathParts.length - 1
                    ] || ""
                );

            if (
                name
                    .toLowerCase()
                    .endsWith(".mp4")
            ) {

                result.push({
                    url: full.href,
                    title:
                        name.replace(
                            /\.mp4$/i,
                            ""
                        )
                });
            }
        }

        return result;
    }

    function playVideo(index) {

        if (
            index < 0 ||
            index >= videos.length
        ) {
            return;
        }

        current = index;

        player.src =
            videos[current].url;

        nowPlaying.textContent =
            "🎬 " +
            videos[current].title +
            " (" +
            (current + 1) +
            " / " +
            videos.length +
            ")";

        document.title =
            videos[current].title +
            " - VELJO-VIDEO";

        Array.from(
            playlist.children
        ).forEach(function (li) {
            li.classList.remove("active");
        });

        const active =
            playlist.children[current];

        if (active) {

            active.classList.add("active");

            active.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    }

    function showPlaylist() {

        playlist.innerHTML = "";

        videos.forEach(
            function (video, index) {

                const li =
                    document.createElement("li");

                const a =
                    document.createElement("a");

                a.href =
                    video.url;

                a.textContent =
                    "🎬 " + video.title;

                a.addEventListener(
                    "click",
                    function (e) {

                        e.preventDefault();

                        playVideo(index);
                    }
                );

                li.appendChild(a);

                playlist.appendChild(li);
            }
        );

        nowPlaying.textContent =
            "🎬 " +
            videos.length +
            " MP4 fajlova";

        status.textContent =
            videos.length +
            " videa spremno";
    }

    playButton.addEventListener(
        "click",
        function () {

            if (videos.length === 0) {
                return;
            }

            if (current === -1) {
                playVideo(0);
            }

            player.play().catch(
                function () {}
            );
        }
    );

    prevButton.addEventListener(
        "click",
        function () {

            if (current > 0) {

                playVideo(current - 1);

                player.play().catch(
                    function () {}
                );
            }
        }
    );

    nextButton.addEventListener(
        "click",
        function () {

            if (
                current <
                videos.length - 1
            ) {

                playVideo(current + 1);

                player.play().catch(
                    function () {}
                );
            }
        }
    );

    player.addEventListener(
        "ended",
        function () {

            if (
                current <
                videos.length - 1
            ) {

                playVideo(current + 1);

                player.play().catch(
                    function () {}
                );
            }
        }
    );

    try {

        videos =
            await scanFolder("music/");

        videos.sort(
            function (a, b) {

                return a.title.localeCompare(
                    b.title,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                );
            }
        );

        showPlaylist();

        console.log(
            "Učitano:",
            videos.length,
            "MP4 fajlova"
        );

    } catch (error) {

        console.error(error);

        nowPlaying.textContent =
            "❌ Greška pri učitavanju videa";

        status.textContent =
            error.message;
    }

});
</script>

</body>
</html>
