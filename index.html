<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veljo Video Muzika</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: #16213e;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #0f3460;
        }
        header h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            color: #e94560;
        }
        .container {
            display: flex;
            flex: 1;
            flex-wrap: wrap;
        }
        .playlist {
            flex: 1 1 300px;
            background: #0f3460;
            padding: 20px;
            overflow-y: auto;
            max-height: 80vh;
            border-right: 2px solid #16213e;
        }
        .playlist h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #e94560;
            border-bottom: 1px solid #e94560;
            padding-bottom: 8px;
        }
        .playlist ul {
            list-style: none;
            padding: 0;
        }
        .playlist li {
            padding: 10px 14px;
            margin-bottom: 6px;
            background: #1a1a3e;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
            font-size: 0.95rem;
            word-break: break-word;
        }
        .playlist li:hover {
            background: #2a2a5e;
            border-left-color: #e94560;
        }
        .playlist li.active {
            background: #e94560;
            color: #fff;
            border-left-color: #fff;
            font-weight: bold;
        }
        .player-wrapper {
            flex: 3 1 500px;
            padding: 20px;
            background: #16213e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .player-wrapper video {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7);
            background: #000;
        }
        .now-playing {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #aaa;
            text-align: center;
            min-height: 2em;
        }
        .now-playing span {
            color: #e94560;
            font-weight: bold;
        }
        footer {
            background: #16213e;
            text-align: center;
            padding: 12px;
            border-top: 2px solid #0f3460;
            color: #666;
            font-size: 0.85rem;
        }
        @media (max-width: 700px) {
            .playlist {
                flex-basis: 100%;
                max-height: 40vh;
                border-right: none;
                border-bottom: 2px solid #16213e;
            }
            .player-wrapper {
                flex-basis: 100%;
            }
            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>🎵 Veljo Video Muzika</h1>
</header>

<div class="container">
    <div class="playlist">
        <h2>📋 Spisak pesama</h2>
        <ul id="playlist"></ul>
    </div>
    <div class="player-wrapper">
        <video id="videoPlayer" controls preload="metadata">
            <source src="" type="video/mp4">
            Vaš pregledač ne podržava video tag.
        </video>
        <div class="now-playing" id="nowPlaying">▶️ Trenutno: <span>nijedna</span></div>
    </div>
</div>

<footer>
    &copy; 2026 Veljo Video Muzika | Svi video zapisi su u vlasništvu autora
</footer>

<script>
    // === LISTA SVIH VIDEO FAJLOVA (ručno definisana) ===
    const videoFiles = [
        "Dodo.mp4",
        "Gore nego lani.mp4",
        "James party.mp4",
        "Mara.mp4",
        "Nebo Sivo Kiša.mp4",
        "Vrbasov Šapat.mp4",
        "Zeleni Brijeg.mp4",
        "boki.mp4",
        "dolazim i ja.mp4",
        "evo me stigoh.mp4",
        "fudbal.mp4",
        "heretic.mp4",
        "jesen.mp4",
        "kita.mp4",
        "lj.mp4",
        "mil.mp4",
        "moja raja.mp4",
        "moja slava.mp4",
        "poslednja luka.mp4",
        "svake noci.mp4",
        "u duhu pravoslavlja.mp4",
        "u nasim godinama.mp4",
        "ustaj.mp4",
        "znakovi.mp4",
        "Ђуличан подрум.mp4",
        "Гламочна бури.mp4",
        "Магарац Самара.mp4",
        "Моје пјесме су остале.mp4",
        "На последњој степеници.mp4",
        "Није било Торте.mp4",
        "живот.mp4",
        "кишни дани.mp4",
        "нестају у мраку.mp4",
        "систем ме дави.mp4",
        "увод.mp4",
        "шкорпија.mp4",
        "ђуличан.mp4",
        "јопет.mp4"
    ];

    // === DOM elementi ===
    const playlistEl = document.getElementById('playlist');
    const videoPlayer = document.getElementById('videoPlayer');
    const nowPlayingSpan = document.querySelector('#nowPlaying span');

    // === Funkcija za prikaz liste ===
    function renderPlaylist() {
        playlistEl.innerHTML = '';
        videoFiles.forEach((filename, index) => {
            const li = document.createElement('li');
            // Ukloni ekstenziju .mp4 za prikaz (lepše)
            const displayName = filename.replace(/\.mp4$/i, '');
            li.textContent = displayName;
            li.dataset.index = index;
            li.dataset.filename = filename;
            li.addEventListener('click', () => playVideo(index));
            playlistEl.appendChild(li);
        });
    }

    // === Funkcija za puštanje videa ===
    function playVideo(index) {
        const filename = videoFiles[index];
        if (!filename) return;

        // Postavi src (URL enkodiranje za bezbednost)
        videoPlayer.src = encodeURIComponent(filename);
        videoPlayer.load();
        videoPlayer.play().catch(err => {
            // Ako browser blokira autoplay, nema veze – korisnik može kliknuti play
            console.warn('Autoplay sprečen:', err);
        });

        // Ažuriraj "trenutno pušta"
        const displayName = filename.replace(/\.mp4$/i, '');
        nowPlayingSpan.textContent = displayName;

        // Označi aktivni element u listi
        const items = playlistEl.querySelectorAll('li');
        items.forEach((li, i) => {
            li.classList.toggle('active', i === index);
        });

        // Sačuvaj u localStorage da zapamtimo poslednji video
        try {
            localStorage.setItem('lastPlayed', index);
        } catch(e) {}
    }

    // === Opcija: ako je sačuvan poslednji video, automatski ga učitaj ===
    function loadLastPlayed() {
        try {
            const lastIndex = localStorage.getItem('lastPlayed');
            if (lastIndex !== null && videoFiles[lastIndex]) {
                playVideo(parseInt(lastIndex, 10));
                return;
            }
        } catch(e) {}
        // Ako nema sačuvanog, pusti prvi
        if (videoFiles.length > 0) {
            playVideo(0);
        }
    }

    // === Inicijalizacija ===
    renderPlaylist();
    loadLastPlayed();
</script>

</body>
</html>
