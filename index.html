cd ~/Desktop/veljo-video/veljo-video-muzika-main && rm -f index.html && echo '<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veljo Video Muzika</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        h1 { color: #ffd700; font-size: 2.5rem; text-shadow: 0 0 20px #ffd70055; }
        .video-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .video-item { background: #1a1a1a; border-radius: 12px; padding: 15px; width: 320px; border: 1px solid #333; }
        video { width: 100%; border-radius: 8px; background: #000; }
        .video-name { margin-top: 8px; font-size: 14px; color: #aaa; }
        footer { margin-top: 50px; padding: 20px; background: #111; border-top: 2px solid #333; color: #888; font-size: 18px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <h1>🎵 VELJO VIDEO MUZIKA</h1>
    <div class="video-grid">' > index.html && for f in ../processed/*.mp4; do name=$(basename "$f" .mp4); echo "        <div class=\"video-item\"><video src=\"$f\" controls></video><div class=\"video-name\">$name</div></div>" >> index.html; done && echo '    </div>
    <footer>MADE BY VELJO</footer>
</body>
</html>' >> index.html
