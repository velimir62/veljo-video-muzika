<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veljo Video Muzika</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            color: #fff;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .video-card {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(255, 68, 68, 0.15);
            border-color: #ff4444;
        }

        .video-card video {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .video-card .info {
            padding: 15px 20px;
        }

        .video-card .info h3 {
            font-size: 1.1rem;
            color: #fff;
            word-break: break-all;
        }

        .video-card .info .filename {
            color: #888;
            font-size: 0.85rem;
            margin-top: 5px;
            font-family: monospace;
        }

        .video-card .controls-hint {
            color: #666;
            font-size: 0.8rem;
            margin-top: 8px;
            display: flex;
            gap: 15px;
        }

        .video-card .controls-hint span {
            background: #252525;
            padding: 2px 10px;
            border-radius: 4px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8rem;
            }

            .video-card video {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <h1>🎵 Veljo Video Muzika</h1>
    <p class="subtitle">📹 MP4 video galerija</p>

    <div class="gallery">
        <!-- систем ме дави.mp4 -->
        <div class="video-card">
            <video controls preload="metadata">
                <source src="icons/систем ме дави.mp4" type="video/mp4">
                Tvoj pretraživač ne podržava video tag.
            </video>
            <div class="info">
                <h3>🎬 Систем ме дави</h3>
                <div class="filename">систем ме дави.mp4</div>
                <div class="controls-hint">
                    <span>▶ Play</span>
                    <span>🔊 Volume</span>
                    <span>⛶ Fullscreen</span>
                </div>
            </div>
        </div>

        <!-- увод.mp4 -->
        <div class="video-card">
            <video controls preload="metadata">
                <source src="icons/увод.mp4" type="video/mp4">
                Tvoj pretraživač ne podržava video tag.
            </video>
            <div class="info">
                <h3>🎬 Увод</h3>
                <div class="filename">увод.mp4</div>
                <div class="controls-hint">
                    <span>▶ Play</span>
                    <span>🔊 Volume</span>
                    <span>⛶ Fullscreen</span>
                </div>
            </div>
        </div>

        <!-- шкорпија.mp4 -->
        <div class="video-card">
            <video controls preload="metadata">
                <source src="icons/шкорпија.mp4" type="video/mp4">
                Tvoj pretraživač ne podržava video tag.
            </video>
            <div class="info">
                <h3>🎬 Шкорпија</h3>
                <div class="filename">шкорпија.mp4</div>
                <div class="controls-hint">
                    <span>▶ Play</span>
                    <span>🔊 Volume</span>
                    <span>⛶ Fullscreen</span>
                </div>
            </div>
        </div>
    </div>

    <footer style="text-align: center; margin-top: 50px; color: #444; font-size: 0.85rem;">
        <p>📁 Fajlovi iz <code>icons/</code> foldera</p>
    </footer>
</body>
</html>
