<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Veljo Video Muzika</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Arial; text-align: center; padding: 20px; }
        h1 { color: #ffd700; }
        .video-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; max-width: 1200px; margin: auto; }
        .video-item { background: #1a1a1a; border-radius: 12px; padding: 15px; width: 320px; border: 1px solid #333; }
        video { width: 100%; border-radius: 8px; background: #000; }
        .video-name { margin-top: 8px; color: #aaa; }
        footer { margin-top: 50px; padding: 20px; background: #111; color: #888; font-size: 18px; }
    </style>
</head>
<body>
    <h1>🎵 VELJO VIDEO MUZIKA</h1>
    <div class="video-grid" id="videoGrid"></div>
    <footer>MADE BY VELJO</footer>
    <script>
        const videoFiles = [
            "Dodo.mp4","Gore nego lani.mp4","James party.mp4","Mara.mp4","Nebo Sivo Kiša.mp4","Vrbasov Šapat.mp4",
            "Zeleni Brijeg.mp4","boki.mp4","dolazim i ja.mp4","evo me stigoh.mp4","fudbal.mp4","heretic.mp4",
            "jesen.mp4","kita.mp4","lj.mp4","mil.mp4","moja raja.mp4","moja slava.mp4","poslednja luka.mp4",
            "svake noci.mp4","u duhu pravoslavlja.mp4","u nasim godinama.mp4","ustaj.mp4","znakovi.mp4",
            "Ђуличан подрум.mp4","Гламочна бури.mp4","Магарац Самара.mp4","Моје пјесме су остале.mp4",
            "На последњој степеници.mp4","Није било Торте.mp4","живот.mp4","кишни дани.mp4","нестају у мраку.mp4",
            "систем ме дави.mp4","увод.mp4","шкорпија.mp4","ђуличан.mp4","јопет.mp4"
        ];
        const grid = document.getElementById('videoGrid');
        videoFiles.forEach(file => {
            const name = file.replace('.mp4','');
            const div = document.createElement('div');
            div.className = 'video-item';
            div.innerHTML = `<video src="processed/${file}" controls></video><div class="video-name">${name}</div>`;
            grid.appendChild(div);
        });
    </script>
</body>
</html>
