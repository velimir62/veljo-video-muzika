<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veljo Video Muzika</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #ffd700;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #999;
            margin-bottom: 25px;
        }
        .player-wrapper {
            max-width: 750px;
            margin: 0 auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.05);
        }
        video {
            width: 100%;
            max-height: 70vh;
            border-radius: 10px;
            background: #000;
        }
        .song-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #ffd700;
            margin: 15px 0 5px;
        }
        .song-counter {
            font-size: 0.9rem;
            color: #888;
        }
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 18px 0 10px;
        }
        .controls button {
            background: #2a2a2a;
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            font-weight: 500;
        }
        .controls button:hover {
            background: #3d3d3d;
            transform: scale(1.03);
        }
        .controls button.active {
            background: #ffd700;
            color: #000;
        }
        .playlist-box {
            max-width: 750px;
            margin: 30px auto 0;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 16px;
            max-height: 420px;
            overflow-y: auto;
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.03);
        }
        .playlist-box h2 {
            text-align: left;
            color: #ffd700;
            font-size: 1.3rem;
            margin: 0 0 15px 10px;
        }
        .song-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin: 5px 0;
            background: #252525;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-item:hover {
            background: #333;
        }
        .song-item.active {
            background: #3d3900;
            border-left: 5px solid #ffd700;
        }
        .song-name {
            font-size: 1rem;
        }
        .song-index {
            color: #888;
            margin-right: 12px;
        }
        .search-box {
            max-width: 750px;
            margin: 15px auto 0;
        }
        #searchInput {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        #searchInput:focus {
            outline: 2px solid #ffd700;
            border-color: transparent;
        }
        footer {
            margin-top: 45px;
            padding: 20px;
            color: #555;
            border-top: 1px solid #222;
        }
        .status-text {
            color: #aaa;
            font-size: 0.9rem;
        }
        .error-msg {
            color: #ff6b6b;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>🎬 Veljo Video Muzika</h1>
    <div class="subtitle">📂 MP4 video zapisi</div>

    <div class="player-wrapper">
        <video id="videoPlayer" controls preload="metadata"></video>
        <div class="song-title" id="currentSongTitle">🎵 Izaberi pjesmu</div>
        <div class="status-text" id="currentStatus">Trenutno: -</div>

        <div class="controls">
            <button id="prevBtn">⏮ Prethodna</button>
            <button id="playBtn">▶ Play</button>
            <button id="nextBtn">⏭ Sljedeća</button>
            <button id="shuffleBtn">🔀 Shuffle</button>
            <button id="repeatBtn">🔁 Repeat</button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔎 Pretraži pjesme...">
    </div>

    <div class="playlist-box" id="playlistContainer">
        <h2>📋 Playlista</h2>
        <div id="playlist"></div>
    </div>

    <footer>
        Veljo Video Muzika © 2026
    </footer>

    <script>
        // === KONFIGURACIJA ===
        const GITHUB_USER = 'velimir62';
        const GITHUB_REPO = 'veljo-video-muzika';
        const GITHUB_BRANCH = 'main';
        const VIDEO_FOLDER = 'processed';

        // === DOM ELEMENTI ===
        const video = document.getElementById('videoPlayer');
        const playlistEl = document.getElementById('playlist');
        const currentTitle = document.getElementById('currentSongTitle');
        const currentStatus = document.getElementById('currentStatus');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const searchInput = document.getElementById('searchInput');

        let songs = [];
        let currentIndex = 0;
        let isShuffle = false;
        let isRepeat = false;

        // === UČITAVANJE PLAYLISTE ===
        async function loadSongs() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${VIDEO_FOLDER}?ref=${GITHUB_BRANCH}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Neuspješno učitavanje liste.');

                const files = await response.json();
                songs = files
                    .filter(f => f.type === 'file' && f.name.endsWith('.mp4'))
                    .map(f => f.name)
                    .sort((a, b) => a.localeCompare(b, 'sr', { sensitivity: 'base' }));

                if (songs.length === 0) {
                    playlistEl.innerHTML = '<p class="error-msg">❌ Nema MP4 fajlova u folderu "processed".</p>';
                    return;
                }

                renderPlaylist(songs);
                if (songs.length > 0) {
                    currentIndex = 0;
                    loadVideo(currentIndex);
                }
            } catch (error) {
                console.error('Greška:', error);
                playlistEl.innerHTML = `<p class="error-msg">❌ Greška: ${error.message}</p>`;
            }
        }

        // === RENDER PLAYLISTE ===
        function renderPlaylist(songList) {
            playlistEl.innerHTML = '';
            songList.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'song-item';
                if (index === currentIndex) div.classList.add('active');
                div.innerHTML = `
                    <span><span class="song-index">${index + 1}.</span> <span class="song-name">${song.replace('.mp4', '')}</span></span>
                    <span style="color:#888;font-size:0.8rem;">▶</span>
                `;
                div.addEventListener('click', () => {
                    currentIndex = index;
                    loadVideo(currentIndex);
                });
                playlistEl.appendChild(div);
            });
            const activeEl = playlistEl.querySelector('.song-item.active');
            if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // === UČITAJ VIDEO ===
        function loadVideo(index) {
            if (!songs.length || index < 0 || index >= songs.length) return;
            const songName = songs[index];
            const videoUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${VIDEO_FOLDER}/${encodeURIComponent(songName)}`;

            video.src = videoUrl;
            video.load();
            currentTitle.textContent = `🎵 ${songName.replace('.mp4', '')}`;
            currentStatus.textContent = `Trenutno: ${index + 1} / ${songs.length}`;

            document.querySelectorAll('.song-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            if (!video.paused) {
                video.play().catch(() => {});
            }

            const activeEl = playlistEl.querySelector('.song-item.active');
            if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // === KONTROLE ===
        function playPause() {
            if (video.paused) {
                video.play().catch(() => {});
            } else {
                video.pause();
            }
        }

        function nextSong() {
            if (!songs.length) return;
            if (isShuffle) {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * songs.length);
                } while (newIndex === currentIndex && songs.length > 1);
                currentIndex = newIndex;
            } else {
                currentIndex = (currentIndex + 1) % songs.length;
            }
            loadVideo(currentIndex);
        }

        function prevSong() {
            if (!songs.length) return;
            if (video.currentTime > 3) {
                video.currentTime = 0;
                return;
            }
            currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            loadVideo(currentIndex);
        }

        // === EVENTI ===
        video.addEventListener('play', () => {
            playBtn.textContent = '⏸ Pause';
        });
        video.addEventListener('pause', () => {
            playBtn.textContent = '▶ Play';
        });
        video.addEventListener('ended', () => {
            if (isRepeat) {
                video.currentTime = 0;
                video.play().catch(() => {});
            } else {
                nextSong();
            }
        });

        playBtn.addEventListener('click', playPause);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });
        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
        });

        // === PRETRAGA ===
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            const items = playlistEl.querySelectorAll('.song-item');
            items.forEach(item => {
                const name = item.querySelector('.song-name').textContent.toLowerCase();
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        });

        // === TASTATURA ===
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); playPause(); }
            if (e.code === 'ArrowRight') { e.preventDefault(); nextSong(); }
            if (e.code === 'ArrowLeft') { e.preventDefault(); prevSong(); }
        });

        // === START ===
        loadSongs();
    </script>
</body>
</html>
