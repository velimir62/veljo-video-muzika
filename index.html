<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELJO-VIDEO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #0b1020;
    color: #e8e8e8;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    max-width: 850px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #e94560;
    font-size: 38px;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    margin-bottom: 20px;
}

.navigation {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
}

.navigation a {
    flex: 1;
    padding: 14px;
    text-align: center;
    text-decoration: none;
    color: white;
    background: #163d6b;
    border-radius: 9px;
    font-weight: bold;
    font-size: 17px;
}

.navigation a.active {
    background: #e94560;
}

.navigation a:hover {
    background: #e94560;
}

.player-box {
    background: #16213e;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
}

.now-playing {
    text-align: center;
    color: #e94560;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 15px;
    min-height: 24px;
}

video {
    width: 100%;
    max-height: 65vh;
    display: block;
    background: black;
    border-radius: 10px;
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #e94560;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff5570;
}

button:active {
    transform: scale(.98);
}

.playlist-title {
    margin-top: 25px;
    color: #e94560;
    font-size: 20px;
    font-weight: bold;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: #16213e;
    margin: 8px 0;
    padding: 14px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: .2s;
}

li:hover {
    background: #0f3460;
    transform: scale(1.01);
}

li.active {
    background: #0f3460;
    border-left: 5px solid #e94560;
}

.status {
    text-align: center;
    color: #888;
    margin-top: 20px;
    font-size: 14px;
}

.error {
    color: #ff4d6d;
    text-align: center;
    font-weight: bold;
}

@media (max-width: 600px) {

    body {
        padding: 12px;
    }

    h1 {
        font-size: 29px;
    }

    .navigation,
    .controls {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🎬 VELJO-VIDEO</h1>

    <div class="subtitle">
        My Media Center — MP4
    </div>

    <div class="navigation">

        <a
            href="https://velimir62.github.io/moja-muzika/">
            🎵 VELJO-RADIO
        </a>

        <a
            href="https://velimir62.github.io/veljo-video-muzika/"
            class="active">
            🎬 VELJO-VIDEO
        </a>

    </div>

    <div class="player-box">

        <div id="nowPlaying" class="now-playing">
            🎬 Učitavanje videa...
        </div>

        <video
            id="player"
            controls
            playsinline
            preload="metadata">
        </video>

        <div class="controls">

            <button id="play">
                ▶ Pokreni
            </button>

            <button id="prev">
                ⏮ Prethodni
            </button>

            <button id="next">
                Sljedeći ⏭
            </button>

        </div>

    </div>

    <div class="playlist-title">
        🎬 Video Playlist
    </div>

    <ul id="playlist"></ul>

    <div id="status" class="status">
        Učitavanje...
    </div>

</div>

<script>

const OWNER = "velimir62";
const REPO = "veljo-video-muzika";
const FOLDER = "music";

const playlist =
    document.getElementById("playlist");

const player =
    document.getElementById("player");

const nowPlaying =
    document.getElementById("nowPlaying");

const status =
    document.getElementById("status");

const playButton =
    document.getElementById("play");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

let videos = [];
let current = -1;


/* ----------------------------------
   UČITAVANJE MP4 SA GITHUBA
---------------------------------- */

async function loadVideos() {

    const api =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`;

    const response =
        await fetch(api, {
            cache: "no-store"
        });

    if (!response.ok) {
        throw new Error(
            "GitHub ne može otvoriti folder music/"
        );
    }

    const files =
        await response.json();

    videos = files
        .filter(file =>
            file.type === "file" &&
            file.name
                .toLowerCase()
                .endsWith(".mp4")
        )
        .map(file => ({
            title: file.name.replace(
                /\.mp4$/i,
                ""
            ),
            url: file.download_url
        }));

    videos.sort((a, b) =>
        a.title.localeCompare(
            b.title,
            undefined,
            {
                numeric: true,
                sensitivity: "base"
            }
        )
    );
}


/* ----------------------------------
   PLAYLISTA
---------------------------------- */

function showPlaylist() {

    playlist.innerHTML = "";

    videos.forEach((video, index) => {

        const li =
            document.createElement("li");

        li.textContent =
            "🎬 " + video.title;

        li.addEventListener(
            "click",
            () => playVideo(index)
        );

        playlist.appendChild(li);
    });

    status.textContent =
        videos.length +
        " MP4 fajlova pronađeno";
}


/* ----------------------------------
   POKRETANJE VIDEA
---------------------------------- */

function playVideo(index) {

    if (
        index < 0 ||
        index >= videos.length
    ) {
        return;
    }

    current = index;

    player.src =
        videos[current].url;

    nowPlaying.textContent =
        "🎬 " +
        videos[current].title +
        "   (" +
        (current + 1) +
        " / " +
        videos.length +
        ")";

    document.title =
        videos[current].title +
        " - VELJO-VIDEO";

    Array.from(
        playlist.children
    ).forEach(li => {
        li.classList.remove("active");
    });

    const active =
        playlist.children[current];

    if (active) {

        active.classList.add("active");

        active.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}


/* ----------------------------------
   POKRENI
---------------------------------- */

playButton.addEventListener(
    "click",
    function () {

        if (videos.length === 0) {
            return;
        }

        if (current === -1) {
            playVideo(0);
        }

        player.play().catch(() => {});
    }
);


/* ----------------------------------
   PRETHODNI
---------------------------------- */

prevButton.addEventListener(
    "click",
    function () {

        if (current > 0) {

            playVideo(current - 1);

            player.play().catch(() => {});
        }
    }
);


/* ----------------------------------
   SLJEDEĆI
---------------------------------- */

nextButton.addEventListener(
    "click",
    function () {

        if (
            current < videos.length - 1
        ) {

            playVideo(current + 1);

            player.play().catch(() => {});
        }
    }
);


/* ----------------------------------
   AUTOMATSKI SLJEDEĆI VIDEO
---------------------------------- */

player.addEventListener(
    "ended",
    function () {

        if (
            current < videos.length - 1
        ) {

            playVideo(current + 1);

            player.play().catch(() => {});
        }
    }
);


/* ----------------------------------
   TIPKE
---------------------------------- */

document.addEventListener(
    "keydown",
    function (e) {

        if (
            e.key === "ArrowRight" &&
            current < videos.length - 1
        ) {

            playVideo(current + 1);
        }

        if (
            e.key === "ArrowLeft" &&
            current > 0
        ) {

            playVideo(current - 1);
        }
    }
);


/* ----------------------------------
   START
---------------------------------- */

async function start() {

    try {

        await loadVideos();

        if (videos.length === 0) {

            nowPlaying.textContent =
                "🎬 Nema MP4 fajlova";

            status.textContent =
                "Provjeri da li su MP4 fajlovi u music/ folderu.";

            return;
        }

        showPlaylist();

        nowPlaying.textContent =
            "🎬 " +
            videos.length +
            " MP4 fajlova spremno";

    } catch (error) {

        console.error(error);

        nowPlaying.innerHTML =
            '<span class="error">❌ Greška pri učitavanju videa</span>';

        status.textContent =
            error.message;
    }
}

start();

</script>

</body>
</html>
