<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veljo Video Muzika</title>
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        h1 { color: #ffd700; }
        .player {
            max-width: 800px;
            margin: 20px auto;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
        }
        video {
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 8px;
        }
        .song-list {
            max-width: 800px;
            margin: 20px auto;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            background: #1a1a1a;
            border-radius: 12px;
            padding: 10px;
        }
        .song-item {
            padding: 12px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            transition: 0.2s;
        }
        .song-item:hover { background: #222; }
        .song-item.active {
            background: #332d00;
            border-left: 3px solid #ffd700;
        }
        .controls {
            margin: 15px 0;
        }
        .controls button {
            background: #222;
            color: #fff;
            border: none;
            padding: 10px 18px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls button:hover { background: #444; }
        .controls button.active {
            background: #ffd700;
            color: #000;
        }
        .search-box {
            max-width: 800px;
            margin: 15px auto;
        }
        #searchInput {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        footer {
            margin-top: 40px;
            padding: 20px;
            color: #666;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>
    <h1>🎬 Veljo Video Muzika</h1>

    <div class="player">
        <video id="videoPlayer" controls preload="metadata"></video>
        <div id="currentSong" style="margin-top:10px;color:#ffd700;font-weight:bold;">Izaberi video</div>
        <div class="controls">
            <button id="prevBtn">⏮ Prethodni</button>
            <button id="playBtn">▶ Play</button>
            <button id="nextBtn">⏭ Sljedeći</button>
            <button id="shuffleBtn">🔀 Shuffle</button>
            <button id="repeatBtn">🔁 Repeat</button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔎 Pretraži videe...">
    </div>

    <div class="song-list" id="songList"></div>

    <footer>MADE BY VELJO</footer>

    <script>
        // === KONFIGURACIJA ===
        const GITHUB_USER = 'velimir62';
        const GITHUB_REPO = 'veljo-video-muzika';
        const GITHUB_BRANCH = 'main';
        const VIDEO_FOLDER = 'processed';

        // === SVI MP4 FAJLOVI IZ /home/veljo/Videos ===
        const videoFiles = [
            "boki.mp4",
            "evo me stigoh.mp4",
            "fudbal.mp4",
            "heretic.mp4",
            "James party.mp4",
            "jesen.mp4",
            "lj.mp4",
            "Mara.mp4",
            "mil.mp4",
            "Milorad Dodik i Aleksandar Vučić u Donjoj ....mp4",
            "moja raja.mp4",
            "moja slava.mp4",
            "Nebo Sivo Kiša.mp4",
            "o nama.mp4",
            "poslednja luka.mp4",
            "svake noci.mp4",
            "u nasim godinama.mp4",
            "ustawi.mp4",
            "Vrbasov Šapat.mp4",
            "Zeleni Brijeg.mp4",
            "znakovi.mp4",
            "Гламочна бури.mp4",
            "Буличан подрум.mp4",
            "ћуличан.mp4",
            "живот.mp4",
            "кишни дани.mp4",
            "Maraapau.mp4",
            "Moje njejce mu ostałe.mp4",
            "Ha последњој стеченици.mp4",
            "нестају у мраку.mp4",
            "Није било Торте.mp4",
            "систем ме дави.mp4",
            "увод.mp4"
        ];

        // === DOM ELEMENTI ===
        const videoPlayer = document.getElementById('videoPlayer');
        const songList = document.getElementById('songList');
        const currentSong = document.getElementById('currentSong');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const repeatBtn = document.getElementById('repeatBtn');
        const searchInput = document.getElementById('searchInput');

        let currentIndex = 0;
        let isShuffle = false;
        let isRepeat = false;

        // === RENDER PLEJLISTE ===
        function renderSongs() {
            songList.innerHTML = '';
            videoFiles.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'song-item' + (index === currentIndex ? ' active' : '');
                div.textContent = song.replace('.mp4', '');
                div.addEventListener('click', () => {
                    currentIndex = index;
                    loadSong(index);
                });
                songList.appendChild(div);
            });
        }

        // === UČITAJ VIDEO ===
        function loadSong(index) {
            if (!videoFiles.length) return;
            const songName = videoFiles[index];
            const videoUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${VIDEO_FOLDER}/${encodeURIComponent(songName)}`;
            videoPlayer.src = videoUrl;
            videoPlayer.load();
            currentSong.textContent = songName.replace('.mp4', '');
            document.querySelectorAll('.song-item').forEach((el, i) => el.classList.toggle('active', i === index));
            videoPlayer.play().catch(() => {});
            // Scroll to active song
            const activeEl = songList.querySelector('.song-item.active');
            if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        // === KONTROLE ===
        function playPause() {
            if (videoPlayer.paused) {
                videoPlayer.play().catch(() => {});
            } else {
                videoPlayer.pause();
            }
        }

        function nextSong() {
            if (!videoFiles.length) return;
            if (isShuffle) {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * videoFiles.length);
                } while (newIndex === currentIndex && videoFiles.length > 1);
                currentIndex = newIndex;
            } else {
                currentIndex = (currentIndex + 1) % videoFiles.length;
            }
            loadSong(currentIndex);
        }

        function prevSong() {
            if (!videoFiles.length) return;
            if (videoPlayer.currentTime > 3) {
                videoPlayer.currentTime = 0;
                return;
            }
            currentIndex = (currentIndex - 1 + videoFiles.length) % videoFiles.length;
            loadSong(currentIndex);
        }

        // === EVENTI ===
        videoPlayer.addEventListener('play', () => { playBtn.textContent = '⏸ Pause'; });
        videoPlayer.addEventListener('pause', () => { playBtn.textContent = '▶ Play'; });
        videoPlayer.addEventListener('ended', () => {
            if (isRepeat) {
                videoPlayer.currentTime = 0;
                videoPlayer.play().catch(() => {});
            } else {
                nextSong();
            }
        });

        playBtn.addEventListener('click', playPause);
        nextBtn.addEventListener('click', nextSong);
        prevBtn.addEventListener('click', prevSong);
        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });
        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
        });

        // === PRETRAGA ===
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase().trim();
            const items = songList.querySelectorAll('.song-item');
            items.forEach(item => {
                const name = item.textContent.toLowerCase();
                item.style.display = name.includes(query) ? 'block' : 'none';
            });
        });

        // === TASTATURA ===
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') { e.preventDefault(); playPause(); }
            if (e.code === 'ArrowRight') { e.preventDefault(); nextSong(); }
            if (e.code === 'ArrowLeft') { e.preventDefault(); prevSong(); }
        });

        // === START ===
        renderSongs();
        if (videoFiles.length > 0) {
            loadSong(0);
        }
    </script>
</body>
</html>
