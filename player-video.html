<!DOCTYPE html>
<html>
<head>
    <title>Video Player</title>
    <style>
        body { font-family: Arial; background: #0d0d0d; color: white; margin: 20px; }
        h1 { text-align: center; }
        video { display: block; margin: auto; max-width: 90%; max-height: 500px; background: black; border-radius: 10px; }
        #playlist { margin-top: 20px; text-align: center; }
        #playlist ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        #playlist li { background: #16213e; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
        #playlist li:hover { background: #0f3460; }
        .back { display: inline-block; margin-top: 20px; color: #4CAF50; text-decoration: none; }
    </style>
</head>
<body>
    <h1>🎬 Video Player</h1>
    <video id="mainVideo" controls>
        Your browser does not support the video tag.
    </video>
    <div id="playlist">
        <h2>My Videos</h2>
        <ul id="videoList"></ul>
    </div>
    <a href="/" class="back">⬅ Back</a>

    <script>
        async function loadVideos() {
            try {
                const response = await fetch('/videos.txt');
                if (!response.ok) throw new Error('videos.txt not found');
                const text = await response.text();
                const files = text.split('\n').filter(f => f.trim() && f.includes('.mp4'));

                const list = document.getElementById('videoList');
                list.innerHTML = '';
                files.forEach(file => {
                    const li = document.createElement('li');
                    li.textContent = file.trim();
                    li.onclick = () => playVideo(file.trim());
                    list.appendChild(li);
                });

                if (files.length > 0) playVideo(files[0].trim());
            } catch(e) {
                document.getElementById('videoList').innerHTML = '<li>No videos found. Create videos.txt with mp4 filenames.</li>';
            }
        }

        function playVideo(filename) {
            const video = document.getElementById('mainVideo');
            video.src = filename;
            video.load();
            video.play();
        }

        loadVideos();
    </script>
</body>
</html>
