<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veljo Radio</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: system-ui;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #eee;
    padding: 20px;
}
.container {
    max-width: 700px;
    margin: auto;
    background: rgba(0,0,0,0.4);
    border-radius: 30px;
    padding: 20px;
}
h1 { text-align: center; margin-bottom: 15px; }

.radio-btn, .next-btn {
    width: 100%;
    border: none;
    padding: 14px;
    font-size: 20px;
    border-radius: 50px;
    margin-bottom: 10px;
    cursor: pointer;
}

.radio-btn { background: #1db954; color: white; }
.next-btn { background: #e94560; color: white; }

.song-btn {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
    border-radius: 30px;
    border: none;
    background: #2a2a4a;
    color: white;
    cursor: pointer;
}
.song-btn:hover { background: #e94560; }

.status { text-align: center; margin: 10px; }
.playlist { max-height: 400px; overflow-y: auto; }

audio { display: none; }
</style>
</head>

<body>

<div class="container">
<h1>🎵 Veljo Radio</h1>

<button id="radioBtn" class="radio-btn">▶️ POKRENI RADIO</button>
<button id="nextBtn" class="next-btn">⏭️ SLJEDEĆA</button>

<div id="status" class="status">Učitavanje...</div>
<div id="list" class="playlist"></div>

<audio id="player"></audio>
</div>

const status = document.getElementById("status");
const radioBtn = document.getElementById("radioBtn");
const nextBtn = document.getElementById("nextBtn");

let songs = [];
let current = 0;
let radioOn = false;

"129систем ме дави.mp3","130Т.mp3","131Ту је сада једна екипа,.mp3","132 четири даме.mp3"

async function loadSongs() {
    const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`);
    const data = await res.json();

    let files = data.filter(f => f.name.endsWith(".mp3"));

    files.sort((a,b)=>{
        let A = customOrder.indexOf(a.name);
        let B = customOrder.indexOf(b.name);
        return (A===-1?9999:A) - (B===-1?9999:B);
    });

    songs = files.map(f => ({
        name: f.name,
        url: f.download_url
    }));

    render();
    status.innerHTML = "Spremno 🎶";
}

function render(){
    list.innerHTML="";
    songs.forEach((s,i)=>{
        let btn=document.createElement("button");
        btn.className="song-btn";
        btn.textContent="🎵 "+s.name.replace(".mp3","");
        btn.onclick=()=>playSong(i);
        list.appendChild(btn);
    });
}

function playSong(i){
    current=i;
    player.src=songs[i].url;
    player.play();
    status.innerHTML="🎵 "+songs[i].name;
}

function nextSong(){
    current++;
    if(current>=songs.length) current=0; // 🔁 LOOP
    playSong(current);
}

player.addEventListener("ended", ()=>{
    if(radioOn) nextSong();
});

radioBtn.onclick=()=>{
    radioOn=!radioOn;

    if(radioOn){
        playSong(current);
        radioBtn.innerHTML="⏸️ STOP";
    } else {
        player.pause();
        radioBtn.innerHTML="▶️ POKRENI RADIO";
    }
};

nextBtn.onclick=nextSong;

loadSongs();
</script>

</body>
</html>
